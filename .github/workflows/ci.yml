name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  real-dsh-smoke:
    # One bounded, keyless Linux host check, independent of the platform matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            smoke/host-fixture/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install locked real DSH runtime
        run: npm ci --prefix smoke/host-fixture --ignore-scripts --no-audit --no-fund
      - name: Exercise real filesystem and bash tool pipeline
        run: timeout 120s npm run smoke:real-dsh -- smoke/host-fixture/node_modules

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # better-sqlite3 v13 ships official prebuilds (prebuilds/<platform>.node);
      # --ignore-scripts skips npm's implicit node-gyp rebuild so Windows
      # runners do not need a Visual Studio toolchain to be found.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      # Publish-artifact verification: build, tarball contents, and a real
      # consumer install of the packed tarball (ESM import + bin smoke).
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm run pack-test

  test-minimum:
    # The engines floor: official DSH's lowest supported Node line.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm run pack-test
