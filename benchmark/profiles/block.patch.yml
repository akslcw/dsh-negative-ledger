# Block group: official reminder off; Negative Ledger block over sqlite.
# __PLUGIN_PATH__ and __LEDGER_DIR__ are replaced per run by benchmark/run.ts
# (the plugin specifier becomes a file:// URL, the ledger dir an absolute path).
- id: repeat-tool-reminder
  disabled: true

- insert:
    - id: negative-ledger
      name: __PLUGIN_PATH__
      config:
        backend: sqlite
        mode: block
        dir: __LEDGER_DIR__
        # Experiment-only: 1s TTL so s4 exercises the command-retry release
        # window inside one session (the production default is unchanged).
        commandRetryAfterMs: 1000
